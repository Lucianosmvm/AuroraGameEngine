name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo branch cancela a run anterior — sem fila de builds obsoletas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Portão rápido: a suíte do runtime é lógica pura (colisão, A*, serialização, estado, rede) —
  # não precisa de GPU, janela nem dispositivo de áudio, então roda no runner mais barato.
  runtime:
    name: Testes (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Aurora.Runtime.Tests/Aurora.Runtime.Tests.csproj

      - name: Build
        run: dotnet build tests/Aurora.Runtime.Tests/Aurora.Runtime.Tests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Aurora.Runtime.Tests/Aurora.Runtime.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=runtime.trx"
          --results-directory artifacts/test-results

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-runtime
          path: artifacts/test-results
          if-no-files-found: ignore

  # A suíte do editor roda no Windows porque é lá que o editor é usado, e porque parte do que
  # ela verifica é caminho de arquivo (separador, glob do export Android). Builda a SOLUÇÃO em
  # vez de listar projeto por projeto: a lista antiga apontava pra samples/, que foi removido
  # do repositório, e o job ficou vermelho sem ninguém perceber — junto com ele parou de rodar
  # o teste que teria pego a fonte padrão sumindo do "Novo Projeto".
  editor:
    name: Build (solução) + testes do editor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Aurora.slnx

      - name: Build
        run: dotnet build Aurora.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/Aurora.Editor.Tests/Aurora.Editor.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=editor.trx"
          --results-directory artifacts/test-results

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-editor
          path: artifacts/test-results
          if-no-files-found: ignore
